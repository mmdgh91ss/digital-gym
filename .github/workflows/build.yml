name: Build Digital Gym APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DigitalGymAndroid-Project.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q DigitalGymAndroid-Project.zip -d project
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalGym-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
